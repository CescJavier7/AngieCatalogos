# Config para el Nginx DEL HOST en el VPS (no va en un contenedor).
# Copiar a /etc/nginx/sites-available/angie y ajustar TU_DOMINIO.
# Luego: ln -s ../sites-available/angie /etc/nginx/sites-enabled/ && nginx -t && systemctl reload nginx
# HTTPS: certbot --nginx -d TU_DOMINIO -d api.TU_DOMINIO

# ── Tienda (Nuxt, contenedor en 127.0.0.1:3300) ──
server {
    listen 80;
    server_name tienda.cescjavier.dev;

    location / {
        proxy_pass http://127.0.0.1:3300;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}

# ── API + panel admin (Medusa, contenedor en 127.0.0.1:9000) ──
server {
    listen 80;
    server_name tienda-api.cescjavier.dev;

    client_max_body_size 20M; # subida de imágenes de producto

    location / {
        proxy_pass http://127.0.0.1:9000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
