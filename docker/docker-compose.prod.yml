# Producción — VPS DigitalOcean (2 GB) con Traefik existente
#
# Convive con los demás contenedores del servidor:
#   - Postgres y Redis viven SOLO en la red interna "angie" (sin puertos)
#   - Backend y tienda se publican vía el Traefik del host (red proxy-net),
#     igual que portfolio-frontend: entrypoint websecure + tls
#   - Además quedan en 127.0.0.1 (9000/3300) para depurar desde el VPS
#
# Uso:  docker compose -f docker-compose.prod.yml --env-file .env.prod up -d --build

name: angiecatalogos

services:
  postgres:
    image: postgres:16-alpine
    container_name: angie-prod-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - angie_pgdata:/var/lib/postgresql/data
    ports:
      # Solo loopback del VPS: para tareas admin vía túnel SSH (migraciones, backups)
      - "127.0.0.1:5433:5432"
    networks: [angie]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
    deploy:
      resources:
        limits:
          memory: 512M

  redis:
    image: redis:7-alpine
    container_name: angie-prod-redis
    restart: unless-stopped
    command: redis-server --maxmemory 128mb --maxmemory-policy allkeys-lru
    volumes:
      - angie_redisdata:/data
    networks: [angie]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    deploy:
      resources:
        limits:
          memory: 160M

  backend:
    build: ../backend
    container_name: angie-prod-backend
    restart: unless-stopped
    # Sin db:migrate al arrancar (las migraciones se corren vía túnel desde fuera)
    # y desde .medusa/server: el modo producción de Medusa exige arrancar ahí
    # El symlink expone /app/static (imágenes de producto) desde el dir compilado
    command: ["sh", "-c", "cd .medusa/server && ln -sfn /app/static static && PATH=$$PATH:/app/node_modules/.bin medusa start"]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      NODE_ENV: production
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET}
      COOKIE_SECRET: ${COOKIE_SECRET}
      STORE_CORS: ${STORE_CORS}
      ADMIN_CORS: ${ADMIN_CORS}
      AUTH_CORS: ${AUTH_CORS}
      BACKEND_PUBLIC_URL: ${BACKEND_PUBLIC_URL}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GOOGLE_CALLBACK_URL: ${GOOGLE_CALLBACK_URL:-}
      # Sincronización con Google Sheets (opcional)
      GOOGLE_SA_KEY_FILE: ${GOOGLE_SA_KEY_FILE:-}
      GOOGLE_SHEET_ID: ${GOOGLE_SHEET_ID:-}
      # Pasarela de pago PayPhone. El ambiente (pruebas/producción) se elige
      # en el panel de PayPhone Developer, no desde aquí.
      PAYPHONE_TOKEN: ${PAYPHONE_TOKEN:-}
      PAYPHONE_STORE_ID: ${PAYPHONE_STORE_ID:-}
      PAYPHONE_IVA: ${PAYPHONE_IVA:-0}
      STOREFRONT_URL: ${STOREFRONT_URL:-}
      # Correo saliente: sin esto los comprobantes solo se escriben en el log
      SENDGRID_API_KEY: ${SENDGRID_API_KEY:-}
      SENDGRID_FROM: ${SENDGRID_FROM:-}
      # A dónde llega el aviso de cada pedido nuevo. Sin esto, no se avisa.
      TIENDA_EMAIL: ${TIENDA_EMAIL:-}
    volumes:
      # JSON de la cuenta de servicio (colocarlo junto al .env.prod)
      - ./google-sa.json:/app/google-sa.json:ro
    ports:
      - "127.0.0.1:9000:9000"
    networks: [angie, proxy-net]
    labels:
      traefik.enable: "true"
      traefik.docker.network: proxy-net
      traefik.http.routers.angie-api.rule: Host(`tienda-api.cescjavier.dev`)
      traefik.http.routers.angie-api.entrypoints: websecure
      traefik.http.routers.angie-api.tls: "true"
      traefik.http.services.angie-api.loadbalancer.server.port: "9000"
    deploy:
      resources:
        limits:
          memory: 1200M

  storefront:
    build: ../storefront
    container_name: angie-prod-storefront
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      NUXT_PUBLIC_MEDUSA_URL: ${BACKEND_PUBLIC_URL}
      NUXT_PUBLIC_MEDUSA_PUBLISHABLE_KEY: ${MEDUSA_PUBLISHABLE_KEY}
      # Nuxt deriva el nombre de la clave runtimeConfig: googleAuthEnabled
      NUXT_PUBLIC_GOOGLE_AUTH_ENABLED: ${NUXT_PUBLIC_GOOGLE_AUTH:-false}
      # Píxel de Meta para medir la publicidad. Vacío = la tienda no carga
      # nada de Facebook.
      NUXT_PUBLIC_META_PIXEL_ID: ${META_PIXEL_ID:-}
    ports:
      - "127.0.0.1:3300:3000"
    networks: [angie, proxy-net]
    labels:
      traefik.enable: "true"
      traefik.docker.network: proxy-net
      traefik.http.routers.angie-store.rule: Host(`tienda.cescjavier.dev`)
      traefik.http.routers.angie-store.entrypoints: websecure
      traefik.http.routers.angie-store.tls: "true"
      traefik.http.services.angie-store.loadbalancer.server.port: "3000"
    deploy:
      resources:
        limits:
          memory: 384M

networks:
  angie:
    name: angie
  proxy-net:
    external: true

volumes:
  angie_pgdata:
  angie_redisdata:
